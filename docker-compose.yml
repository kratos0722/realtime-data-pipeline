services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 12

  producer:
    build: .
    depends_on:
      redpanda:
        condition: service_healthy
    command: ["produce", "--bootstrap", "redpanda:9092", "--topic", "orders", "--count", "500"]

  consumer:
    build: .
    depends_on:
      redpanda:
        condition: service_healthy
    command: ["consume", "--bootstrap", "redpanda:9092", "--topic", "orders",
              "--db", "/data/warehouse.duckdb", "--max-messages", "500"]
    volumes:
      - ./data:/data
