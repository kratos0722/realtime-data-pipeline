[project]
name = "realtime-data-pipeline"
version = "0.1.0"
description = "Streaming event-analytics pipeline: Kafka ingest -> windowed aggregation -> DuckDB warehouse"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "duckdb>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
kafka = ["kafka-python>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
